## Euro-Office (OnlyOffice-based Document Server) subdomain config for SWAG
# OpenCloud 7.5+ - alternative to Collabora (run only ONE of them)
# Place in: /config/nginx/proxy-confs/  as  euro-office.subdomain.conf
# Adjust server_name to your subdomain.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name euro-office.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 100M;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app euro-office;
        set $upstream_port 80;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Document Server builds its own URLs from these
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        # Websockets for co-editing
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
